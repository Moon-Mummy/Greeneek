# Opt-in reference for @modelcontextprotocol/server-memory 2026.7.4. Install
# the pinned executable first; GNK starts it but does not run a package manager.
- insert:
    - id: memory-mcp-reference
      name: '@greeneek/gnk-mcp-client'
      config:
        serverName: reference_memory
        transport: stdio
        command: mcp-server-memory
        cwd: !!js process.cwd()
        env:
          MEMORY_FILE_PATH: !!js >-
            process.env.MEMORY_FILE_PATH?.trim() || process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:os').homedir(), '.gnk-mcp-reference-memory.jsonl')
