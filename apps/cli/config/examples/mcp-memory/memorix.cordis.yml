# Opt-in reference for Memorix 1.3.0. Install the pinned `memorix` executable
# first; GNK starts it but does not run a package manager.
- insert:
    - id: memory-memorix
      name: '@greeneek/gnk-mcp-client'
      config:
        serverName: memorix
        transport: stdio
        command: memorix
        args: [serve]
        cwd: !!js process.cwd()
