# Keyless generic ACP v1 control-surface patch over `gnk --profile acp`.

- id: llm-greeneek
  name: '@greeneek/gnk-llm-greeneek'
  disabled: true

- id: acp
  name: '@greeneek/gnk-acp'
  config:
    provider: control-fixture
    model: alpha

- id: session-persistence-jsonl
  name: '@greeneek/gnk-session-persistence-jsonl'
  config:
    root: !!js process.env.GNK_CONFORMANCE_PERSISTENCE_ROOT
    compression: none

- insert:
    - id: control-surface-llm
      name: './control-surface-llm.ts'
