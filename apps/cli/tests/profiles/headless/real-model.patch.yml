# Test-only agent and persistence patch over the shipped base + headless
# profile. The shared driver owns the turn, so the product runner stays off.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: llm-greeneek
  config:
    thinking: enabled
    reasoningEffort: max
    models:
      - id: greeneek-v4-pro
        contextWindow: 128000
      - id: greeneek-v4-flash
        contextWindow: 128000

- id: agent-loop
  config:
    agents:
      - id: main
        provider: greeneek-official
        model: greeneek-v4-flash
        cwd: !!js process.cwd()

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: !!js "process.env.GNK_SNAPSHOT === undefined ? 'zstd' : 'none'"
