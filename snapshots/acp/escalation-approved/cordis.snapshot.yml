# Replay-only patch layered after `cordis.yml`: replace the network adapter
# with recorded JSONL, pin the recorded top-level model, and keep persistence
# raw for fixture harvesting.

- id: llm-greeneek
  name: '@greeneek/gnk-llm-greeneek'
  disabled: true

- id: acp
  name: '@greeneek/gnk-acp'
  config:
    provider: greeneek-official
    model: greeneek-v4-flash

- id: session-persistence-jsonl
  name: '@greeneek/gnk-session-persistence-jsonl'
  config:
    root: !!js process.env.GNK_SNAPSHOT_SESSIONS_ROOT ?? gnkHomePath('sessions')
    compression: none

- id: sandbox
  name: '@greeneek/gnk-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@greeneek/gnk-llm-replay'
      config:
        providers:
          - id: greeneek-official
            name: Greeneek
            models:
              - id: greeneek-v4-flash
              - id: greeneek-v4-pro

    - id: subagent-settlement-marker
      name: './subagent-settlement-marker.ts'
