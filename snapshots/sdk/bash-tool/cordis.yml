# SDK snapshot-record composition without provider-specific upload metadata.

- id: skill-filesystem
  name: '@greeneek/gnk-skill-filesystem'
  config:
    includeDefaultRoots: false

- id: llm-greeneek
  name: '@greeneek/gnk-llm-greeneek'
  config:
    thinking: enabled
    reasoningEffort: max

- id: session-persistence-jsonl
  name: '@greeneek/gnk-session-persistence-jsonl'
  config:
    root: !!js gnkHomePath('sessions')
    compression: !!js "process.env.GNK_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: tool-subagent
  name: '@greeneek/gnk-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: one-shot
    enableRunInBackground: false
    maxDepth: 1
