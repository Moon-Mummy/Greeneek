# TypeScript SDK snapshot-record patch over `gnk --profile sdk`.

# The fixture corpus must not depend on the developer's personal skill roots.
# Ordinary product launches retain the sdk profile's default skill discovery.
- id: skill-filesystem
  name: '@greeneek/gnk-skill-filesystem'
  config:
    includeDefaultRoots: false

- id: llm-greeneek
  name: '@greeneek/gnk-llm-greeneek'
  config:
    thinking: enabled
    reasoningEffort: max

- id: session-persistence-jsonl
  name: '@greeneek/gnk-session-persistence-jsonl'
  config:
    root: !!js gnkHomePath('sessions')
    compression: !!js "process.env.GNK_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: tool-subagent
  name: '@greeneek/gnk-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: one-shot
    enableRunInBackground: false
    maxDepth: 1

- id: session-log-greeneek
  name: '@greeneek/gnk-session-log-greeneek'
  config:
    enabled: true
