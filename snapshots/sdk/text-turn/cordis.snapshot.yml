# Keyless TypeScript SDK replay patch over the live profile patch.

- id: llm-greeneek
  name: '@greeneek/gnk-llm-greeneek'
  disabled: true

- insert:
    - id: llm-replay
      name: '@greeneek/gnk-llm-replay'
      config:
        providers:
          - id: greeneek-official
            name: Greeneek
            models:
              - id: greeneek-v4-flash

- id: session-log-greeneek
  name: '@greeneek/gnk-session-log-greeneek'
  config:
    enabled: true
