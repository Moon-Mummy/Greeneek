# Keyless replay layer for the GNK SDK dynamic-route snapshot.

- insert:
    - id: llm-replay
      name: '@greeneek/gnk-llm-replay'
      config:
        providers:
          - id: greeneek-official
            name: Greeneek
            models:
              - id: mock-delegate
          - id: mock
            name: Mock
            models:
              - id: mock-routed
                reasoningEfforts: [max]

    - id: sdk-jsonrpc-server-dynamic-replay
      name: '@greeneek/gnk-sdk-jsonrpc-server'
      inject: [sdkAppStartup, loader]
      config:
        maxTokensAsSuccess: true
