# Keyless replay counterpart to pty.cordis.yml.
- id: llm-greeneek
  name: '@greeneek/gnk-llm-greeneek'
  disabled: true

- insert:
    - id: pty
      name: '@greeneek/gnk-terminal'
    - id: pty-snapshot-backend
      name: './pty-snapshot-backend.mjs'
    - id: tool-terminal
      name: '@greeneek/gnk-tool-terminal'
      config:
        maxResultBytes: 64
    - id: llm-replay
      name: '@greeneek/gnk-llm-replay'
      config:
        providers:
          - id: greeneek-official
            name: Greeneek
            models:
              - id: greeneek-v4-flash
              - id: greeneek-v4-pro
