# Minimal keyless composition: real app, pwsh executor, and pwsh tool; replayed model.
- id: llm-greeneek
  name: '@greeneek/gnk-llm-greeneek'
  disabled: true

- insert:
    - id: llm-replay
      name: '@greeneek/gnk-llm-replay'
      config:
        providers:
          - id: greeneek-official
            name: Greeneek
            models:
              - id: greeneek-v4-pro

- id: subprocess
  name: '@greeneek/gnk-subprocess-local'

- id: bash-sandbox
  name: '@greeneek/gnk-bash-sandbox'
  disabled: true

- id: pwsh-sandbox
  name: '@greeneek/gnk-pwsh-sandbox'
  disabled: false

- id: shell-env
  name: '@greeneek/gnk-shell-env'

- id: agent-default-model
  name: '@greeneek/gnk-agent-default-model'
  config:
    provider: greeneek-official
    model: greeneek-v4-pro

- id: session-persistence-jsonl
  name: '@greeneek/gnk-session-persistence-jsonl'
  config:
    root: !!js gnkHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@greeneek/gnk-agent-instructions'
  disabled: true

- id: system-prompt
  name: '@greeneek/gnk-system-prompt'
  config:
    persona: You are a concise snapshot agent working in {{cwd}}.

- id: goal
  name: '@greeneek/gnk-goal'
  disabled: true

- id: goal-round-driver
  name: '@greeneek/gnk-goal-round-driver'
  disabled: true

- id: command-goal
  name: '@greeneek/gnk-command-goal'
  disabled: true

- id: tool-goal
  name: '@greeneek/gnk-tool-goal'
  disabled: true

- id: skill
  name: '@greeneek/gnk-skill'
  disabled: true

- id: skill-filesystem
  name: '@greeneek/gnk-skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@greeneek/gnk-tool-skill'
  disabled: true

- id: tool-bash
  name: '@greeneek/gnk-tool-bash'
  disabled: true

- id: tool-pwsh
  name: '@greeneek/gnk-tool-pwsh'
  disabled: false
