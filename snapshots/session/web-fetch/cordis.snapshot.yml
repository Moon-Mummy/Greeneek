# Keyless replay counterpart: deterministic HTTP remains real; only the model
# adapter is replaced by replay.
- id: llm-greeneek
  name: '@greeneek/gnk-llm-greeneek'
  disabled: true

- insert:
    - id: llm-replay
      name: '@greeneek/gnk-llm-replay'
      config:
        providers:
          - id: greeneek-official
            name: Greeneek
            models:
              - id: greeneek-v4-flash
              - id: greeneek-v4-pro

    - id: web-fetch-fixture
      name: './web-fetch-fixture-server.mjs'

- id: web
  name: '@greeneek/gnk-web'

- id: web-fetch-http
  name: '@greeneek/gnk-web-fetch-http'
  disabled: true

- id: tool-web
  name: '@greeneek/gnk-tool-web'
  config:
    search: false
