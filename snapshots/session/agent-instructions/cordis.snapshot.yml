# Keyless replay counterpart of agent-instructions.cordis.yml: apply the
# scenario values and model swap to the ACP profile.
- id: llm-greeneek
  name: '@greeneek/gnk-llm-greeneek'
  disabled: true

- id: agent-default-model
  name: '@greeneek/gnk-agent-default-model'
  config:
    provider: greeneek-official
    model: greeneek-v4-flash

- id: session-persistence-jsonl
  name: '@greeneek/gnk-session-persistence-jsonl'
  config:
    root: !!js gnkHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@greeneek/gnk-agent-instructions'
  config:
    maxBytes: 65536
    gnkHome: !!js process.cwd() + '/.gnk'
    projectRootMarkers:
      - .gnk-project

- id: system-prompt
  name: '@greeneek/gnk-system-prompt'
  config:
    persona: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: llm-replay
      name: '@greeneek/gnk-llm-replay'
      config:
        providers:
          - id: greeneek-official
            name: Greeneek
            models:
              - id: greeneek-v4-flash
              - id: greeneek-v4-pro
    - id: workspace-context-compaction
      name: '../../../packages/test-support/session-snapshot/tests/fixtures/workspace-context-compaction.ts'
