# Keyless context-overflow replay composition.

- id: llm-greeneek
  name: '@greeneek/gnk-llm-greeneek'
  disabled: true

- id: session-persistence-jsonl
  name: '@greeneek/gnk-session-persistence-jsonl'
  config:
    root: !!js gnkHomePath('sessions')
    compression: none

- id: compaction-basic
  name: '@greeneek/gnk-compaction-basic'
  config:
    thresholdRatio: 0.99
    retainTokens: 20
    maxTokens: 32

- insert:
    - id: llm-replay
      name: '@greeneek/gnk-llm-replay'
      config:
        providers:
          - id: greeneek-official
            name: Greeneek
            models:
              - id: greeneek-v4-flash
                contextWindow: 128000
