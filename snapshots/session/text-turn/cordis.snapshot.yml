# Replay patch shared by the ordinary headless snapshot composition. The model
# script comes from the scenario's committed session JSONL.

- id: llm-greeneek
  name: '@greeneek/gnk-llm-greeneek'
  disabled: true

- id: plugin-package-inventory-greeneek
  disabled: true

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@greeneek/gnk-session-persistence-jsonl'
  config:
    root: !!js gnkHomePath('sessions')
    compression: none

- id: sandbox
  name: '@greeneek/gnk-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@greeneek/gnk-llm-replay'
      config:
        providers:
          - id: greeneek-official
            name: Greeneek
            models:
              - id: greeneek-v4-flash
              - id: greeneek-v4-pro
