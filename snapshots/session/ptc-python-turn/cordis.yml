# Private Python PTC composition: replace the headless worker provider through
# the real Loader and render the generated Python SDK prompt.
- id: agent-default-model
  name: '@greeneek/gnk-agent-default-model'
  config:
    provider: greeneek-official
    model: greeneek-v4-pro

- id: session-persistence-jsonl
  name: '@greeneek/gnk-session-persistence-jsonl'
  config:
    root: !!js gnkHomePath('sessions')
    compression: !!js 'process.env.GNK_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@greeneek/gnk-agent-instructions'
  config:
    maxBytes: 65536

- id: tools
  name: '@greeneek/gnk-tools'
  config:
    mode: ptc

- id: code-runtime
  disabled: true

- insert:
    - id: code-runtime-python
      name: '@greeneek/gnk-experimental-code-runtime-python'

- id: system-prompt
  name: '@greeneek/gnk-system-prompt'
  config:
    persona: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}.

      Verify your work by running the code or tests. Keep answers brief and factual.
