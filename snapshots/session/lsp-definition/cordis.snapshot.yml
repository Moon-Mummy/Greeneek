# Keyless replay keeps the LSP composition intact and replaces only the model adapter.
- id: llm-greeneek
  name: '@greeneek/gnk-llm-greeneek'
  disabled: true

- insert:
    - id: lsp
      name: '@greeneek/gnk-lsp'
    - id: lsp-stdio
      name: '@greeneek/gnk-lsp-stdio'
      config:
        servers:
          fixture:
            command: !!js process.execPath
            args: ['./lsp-server.mjs']
            extensionToLanguage:
              '.ts': typescript
    - id: tool-lsp
      name: '@greeneek/gnk-tool-lsp'
      config:
        maxLocations: 1
    - id: llm-replay
      name: '@greeneek/gnk-llm-replay'
      config:
        providers:
          - id: greeneek-official
            name: Greeneek
            models:
              - id: greeneek-v4-flash
              - id: greeneek-v4-pro

- id: timeout-policy
  name: '@greeneek/gnk-tool-call-timeout-policy'
