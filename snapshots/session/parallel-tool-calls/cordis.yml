# Filesystem-scenario overlay: the sandboxed filesystem stack already lives in
# `gnk-base`, so this patch changes only the local tool-result spill
# storage those scenarios exercise.

- id: spill-local
  name: '@greeneek/gnk-spill-local'
  config:
    root: !!js process.env.GNK_SNAPSHOT_SPILL_ROOT ?? './.spill'

- id: spill-policy
  name: '@greeneek/gnk-spill-policy'
  config:
    maxInlineBytes: !!js process.env.GNK_SNAPSHOT && 800 || 50000
