# Minimal live counterpart for the persistent-pwsh-tool-turn snapshot composition.
- id: llm-greeneek
  name: '@greeneek/gnk-llm-greeneek'
  config:
    models:
      - id: greeneek-v4-pro

- id: sandbox-policy
  name: '@greeneek/gnk-sandbox-policy'
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()

- id: subprocess
  name: '@greeneek/gnk-subprocess-local'

- insert:
    - id: terminal
      name: '@greeneek/gnk-terminal'

- insert:
    - id: terminal-pwsh
      name: '@greeneek/gnk-terminal-bash'
      config:
        shellDialect: pwsh
        timeoutMs: 30000

- id: agent-default-model
  name: '@greeneek/gnk-agent-default-model'
  config:
    provider: greeneek-official
    model: greeneek-v4-pro

- id: session-persistence-jsonl
  name: '@greeneek/gnk-session-persistence-jsonl'
  config:
    root: !!js gnkHomePath('sessions')
    compression: !!js 'process.env.GNK_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@greeneek/gnk-agent-instructions'
  disabled: true

- id: system-prompt
  name: '@greeneek/gnk-system-prompt'
  config:
    persona: You are a concise snapshot agent working in {{cwd}}.

- id: tool-jobs
  name: '@greeneek/gnk-tool-jobs'
  disabled: true

- id: goal
  name: '@greeneek/gnk-goal'
  disabled: true

- id: goal-round-driver
  name: '@greeneek/gnk-goal-round-driver'
  disabled: true

- id: command-goal
  name: '@greeneek/gnk-command-goal'
  disabled: true

- id: tool-goal
  name: '@greeneek/gnk-tool-goal'
  disabled: true

- id: skill
  name: '@greeneek/gnk-skill'
  disabled: true

- id: skill-filesystem
  name: '@greeneek/gnk-skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@greeneek/gnk-tool-skill'
  disabled: true

- id: tool-bash
  name: '@greeneek/gnk-tool-bash'
  disabled: true

- insert:
    - id: tool-pwsh-persistent
      name: '@greeneek/gnk-tool-pwsh-persistent'
