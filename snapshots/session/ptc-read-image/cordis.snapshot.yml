# Keyless replay combines PTC mode with the durable image store and an exact
# image-capable replay route. The scenario generates its tiny PNG inside the
# run_code program, then exercises read_image as a nested dispatch.
- id: llm-greeneek
  name: '@greeneek/gnk-llm-greeneek'
  disabled: true

- id: plugin-package-inventory-greeneek
  disabled: true

- id: agent-default-model
  name: '@greeneek/gnk-agent-default-model'
  config:
    provider: greeneek-official
    model: greeneek-v4-flash-vision-exp

- id: session-persistence-jsonl
  name: '@greeneek/gnk-session-persistence-jsonl'
  config:
    root: !!js gnkHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@greeneek/gnk-agent-instructions'
  config:
    maxBytes: 65536

- id: tools
  name: '@greeneek/gnk-tools'
  config:
    mode: ptc

- id: system-prompt
  name: '@greeneek/gnk-system-prompt'
  config:
    persona: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: llm-replay
      name: '@greeneek/gnk-llm-replay'
      config:
        providers:
          - id: greeneek-official
            name: Greeneek
            models:
              - id: greeneek-v4-flash
                inputModalities: [text]
              - id: greeneek-v4-pro
                inputModalities: [text]
              - id: greeneek-v4-flash-vision-exp
                inputModalities: [text, image]

- id: attachment-local
  name: '@greeneek/gnk-attachment-local'
