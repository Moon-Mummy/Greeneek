# Keyless replay for the read-image success scenario. This profile patch swaps
# the adapter and re-pins the recorded vision model. The replay catalog declares image input,
# so the strict read_image gate accepts the route and the tool result carries
# the durable image block.
- id: llm-greeneek
  name: '@greeneek/gnk-llm-greeneek'
  disabled: true

- id: agent-default-model
  name: '@greeneek/gnk-agent-default-model'
  config:
    provider: greeneek-official
    model: greeneek-v4-flash-vision-exp

- id: session-persistence-jsonl
  name: '@greeneek/gnk-session-persistence-jsonl'
  config:
    root: !!js gnkHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@greeneek/gnk-agent-instructions'
  config:
    maxBytes: 65536

- id: system-prompt
  name: '@greeneek/gnk-system-prompt'
  config:
    persona: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: llm-replay
      name: '@greeneek/gnk-llm-replay'
      config:
        providers:
          - id: greeneek-official
            name: Greeneek
            models:
              - id: greeneek-v4-flash
                inputModalities: [text]
              - id: greeneek-v4-pro
                inputModalities: [text]
              - id: greeneek-v4-flash-vision-exp
                inputModalities: [text, image]

- id: attachment-local
  name: '@greeneek/gnk-attachment-local'
