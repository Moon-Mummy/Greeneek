[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "greeneek-harness-runtime-bin"
version = "0.0.0.dev0"
description = "Bundled gnk CLI runtime for the Greeneek Harness Python SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Greeneek" }]

[project.urls]
Homepage = "https://github.com/greeneek/greeneek-harness"
Documentation = "https://github.com/greeneek/greeneek-harness/blob/master/python/sdk-runtime/README.md"
Issues = "https://github.com/greeneek/greeneek-harness/issues"
Source = "https://github.com/greeneek/greeneek-harness"

[project.scripts]
gnk = "greeneek_harness_runtime:main"

# Include the injected gnk executable and sidecars; exclude the dev-only node closure.
[tool.hatch.build]
artifacts = ["src/greeneek_harness_runtime/runtime/greeneek-harness-sdk-runtime-*"]
exclude = ["src/greeneek_harness_runtime/runtime/node"]

[tool.hatch.build.targets.wheel]
packages = ["src/greeneek_harness_runtime"]

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist.hooks.custom]
