# Minimal tool-pwsh composition: real app boot path, real pwsh executor, real
# foreground + background tool calls; driven by the package's loader.spec.ts.
- id: system-prompt
  name: '@greeneek/gnk-system-prompt'

- id: tools
  name: '@greeneek/gnk-tools'

- id: subprocess
  name: '@greeneek/gnk-subprocess-local'

- id: bash
  name: '@greeneek/gnk-pwsh-local'
  config:
    graceMs: 200

- id: shell-env
  name: '@greeneek/gnk-shell-env'

- id: tasks
  name: '@greeneek/gnk-jobs-local'

- id: tool-jobs
  name: '@greeneek/gnk-tool-jobs'

- id: tool-pwsh
  name: '@greeneek/gnk-tool-pwsh'
