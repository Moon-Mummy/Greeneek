# The automation-only ACP application over gnk-base. Stdout belongs to ACP.

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

- id: session-title-llm
  disabled: true

- insert:
    - id: acp-app-startup
      name: '@greeneek/gnk-acp-app'

    # No provider/model is pinned: this build ships no provider of its own, so
    # the route comes from the user's configuration (the `llm-pi-ai` settings
    # section their API key activates). Both fields stay available for a
    # deployment that wants every ACP session to start on one fixed model.
    - id: acp
      name: '@greeneek/gnk-acp'
      inject: [acpAppStartup]
