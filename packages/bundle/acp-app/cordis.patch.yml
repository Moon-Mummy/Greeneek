# The automation-only ACP application over gnk-base. Stdout belongs to ACP.

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

- id: session-title-llm
  disabled: true

- insert:
    - id: acp-app-startup
      name: '@greeneek/gnk-acp-app'

    - id: acp
      name: '@greeneek/gnk-acp'
      inject: [acpAppStartup]
      config:
        provider: greeneek-official
        model: greeneek-v4-flash
