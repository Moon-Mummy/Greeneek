# The SDK application over gnk-base. Stdout belongs exclusively to JSON-RPC.

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

- id: session-title-llm
  disabled: true

- insert:
    - id: sdk-app-startup
      name: '@greeneek/gnk-sdk-app'
      config:
        profile: sdk

    - id: sdk-jsonrpc-server
      name: '@greeneek/gnk-sdk-jsonrpc-server'
      inject: [sdkAppStartup, loader]
      config:
        maxTokensAsSuccess: !!js "process.env.GNK_MAX_TOKENS_AS_SUCCESS === undefined ? true : JSON.parse(process.env.GNK_MAX_TOKENS_AS_SUCCESS)"
