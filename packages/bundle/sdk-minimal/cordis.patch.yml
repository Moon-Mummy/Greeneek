# Standalone minimal SDK application. Unlike the ordinary SDK profile, this
# bundle does not layer over gnk-base: this insert is the complete Cordis tree.
# User profile, home, and invocation patches still apply above it.

- insert:
    - id: sdk-app-startup
      name: '@greeneek/gnk-sdk-app'
      config:
        profile: sdk-minimal

    - id: sdk-jsonrpc-server
      name: '@greeneek/gnk-sdk-jsonrpc-server'
      inject: [sdkAppStartup, loader]
      config:
        maxTokensAsSuccess: false

    - id: greeneek-llm-api-extensions
      name: '@greeneek/gnk-greeneek-llm-api-extensions'

    - id: session-log-greeneek
      name: '@greeneek/gnk-session-log-greeneek'

    - id: plugin-package-inventory-greeneek
      name: '@greeneek/gnk-plugin-package-inventory-greeneek'

    # This profile mounts no settings or credential provider, so its routes are
    # composition rather than a document the user edits: each names the
    # environment variable holding its key, and a route whose variable is unset
    # simply fails its first request with MISSING_CREDENTIAL. The SDK
    # initialization request picks which of them a session uses.
    - id: llm-pi-ai
      name: '@greeneek/gnk-llm-pi-ai'
      config:
        providers:
          openai:
            apiKeyEnv: OPENAI_API_KEY
            streamIdleTimeoutMs: 172800000
            defaultContextWindow: !!js >-
              Number(process.env.GNK_CONTEXT_WINDOW ?? 1000000)
          anthropic:
            apiKeyEnv: ANTHROPIC_API_KEY
            streamIdleTimeoutMs: 172800000
            defaultContextWindow: !!js >-
              Number(process.env.GNK_CONTEXT_WINDOW ?? 1000000)
          google:
            apiKeyEnv: GEMINI_API_KEY
            streamIdleTimeoutMs: 172800000
            defaultContextWindow: !!js >-
              Number(process.env.GNK_CONTEXT_WINDOW ?? 1000000)

    - id: sandbox
      name: '@greeneek/gnk-sandbox-local'

    # Shared projection registry: sandbox-policy and terminal-bash fold
    # sandbox-mode state through its units and require it as a hard injection.
    - id: session-projection
      name: '@greeneek/gnk-session-projection'

    - id: sandbox-policy
      name: '@greeneek/gnk-sandbox-policy'
      config:
        mode: danger-full-access
        workspaceRoot: !!js process.cwd()

    - id: subprocess
      name: '@greeneek/gnk-subprocess-local'

    - id: pty
      name: '@greeneek/gnk-terminal'

    - id: terminal-bash
      name: '@greeneek/gnk-terminal-bash'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 300000

    - id: terminal-pwsh
      name: '@greeneek/gnk-terminal-bash'
      disabled: !!js process.platform !== 'win32'
      config:
        shellDialect: pwsh
        timeoutMs: 300000

    # The editor uses the bare local filesystem; persistent Bash still consumes
    # the shared danger-full-access sandbox policy above.
    - id: fs-local
      name: '@greeneek/gnk-fs-local'
      config:
        cwd: !!js process.cwd()

    # Keep the minimal agent kernel explicit: unlike gnk-base, this profile
    # owns each service row and omits every optional producer it does not use.
    - id: timer
      name: '@greeneek/cordis-plugin-timer'

    - id: llm
      name: '@greeneek/gnk-llm'

    - id: session
      name: '@greeneek/gnk-session'

    - id: session-title
      name: '@greeneek/gnk-session-title'
      config:
        fallbackMaxWords: 5
        fallbackMaxBytes: 40
        maxTitleBytes: 80

    - id: system-prompt
      name: '@greeneek/gnk-system-prompt'
      config:
        includeHarnessIdentity: false
        includeRuntimeContext: false
        persona: !!js process.env.GNK_SYSTEM_PROMPT ?? 'You are a helpful software engineer assistant.'

    - id: tools
      name: '@greeneek/gnk-tools'

    - id: agent
      name: '@greeneek/gnk-agent'

    - id: llm-retry
      name: '@greeneek/gnk-llm-retry'

    - id: jobs
      name: '@greeneek/gnk-jobs-local'

    - id: invariants
      name: '@greeneek/gnk-invariants'

    - id: session-invariant
      name: '@greeneek/gnk-session/invariant'

    - id: agent-invariant
      name: '@greeneek/gnk-agent/invariant'

    - id: scope-invariant
      name: '@greeneek/gnk-scope/invariant'

    - id: agent-loop-invariant
      name: '@greeneek/gnk-agent-loop/invariant'

    - id: agent-loop
      name: '@greeneek/gnk-agent-loop'
      config:
        agents: []

    - id: persistent-bash
      name: '@greeneek/gnk-tool-bash-persistent'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 300000
        description: |-
          Run commands in a bash shell
          * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
          * You don't have access to the internet via this tool.
          * You do have access to a mirror of common linux and python packages via apt and pip.
          * State is persistent across command calls and discussions with the user.
          * To inspect a particular line range of a file, e.g. lines 10-25, try 'sed -n 10,25p /path/to/the/file'.
          * Please avoid commands that may produce a very large amount of output.
          * Please run long lived commands in the background, e.g. 'sleep 10 &' or start a server in the background.

    - id: persistent-pwsh
      name: '@greeneek/gnk-tool-pwsh-persistent'
      disabled: !!js process.platform !== 'win32'
      config:
        timeoutMs: 300000
        description: |-
          Run commands in a PowerShell shell
          * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
          * You don't have access to the internet via this tool.
          * State is persistent across command calls and discussions with the user.
          * Use native Windows paths (C:\...) and $env:NAME variables; this is PowerShell, not bash.
          * Please avoid commands that may produce a very large amount of output.
          * Please run long lived commands in the background, e.g. 'Start-Job' or start a server with Start-Process.

    - id: str-replace-editor
      name: '@greeneek/gnk-tool-str-replace-editor'
      config:
        maxOutputChars: 16000

    - id: sessions
      name: '@greeneek/gnk-session-persistence-jsonl'
      config:
        root: !!js gnkHomePath('sessions')
        compression: none
