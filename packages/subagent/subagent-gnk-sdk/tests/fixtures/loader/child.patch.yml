# SDK-profile patch for the child runtime in the cwd-inheritance proof.

- id: llm-greeneek
  name: '@greeneek/gnk-llm-greeneek'
  disabled: true

- id: system-prompt
  name: '@greeneek/gnk-system-prompt'
  config:
    persona: 'Echo where you run.'

- id: agent-instructions
  name: '@greeneek/gnk-agent-instructions'
  disabled: true

- id: skill-filesystem
  name: '@greeneek/gnk-skill-filesystem'
  config:
    includeDefaultRoots: false

- id: session-persistence-jsonl
  name: '@greeneek/gnk-session-persistence-jsonl'
  config:
    root: !!js gnkHomePath('sessions')
    compression: none

- insert:
    - id: child-mock-llm
      name: './child-mock-llm.ts'
